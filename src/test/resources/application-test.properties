# H2 por defecto. TEST_DB_* permite ejecutar la suite contra MySQL 8 en CI.
spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:salus_test;MODE=MySQL}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${TEST_DDL_AUTO:create-drop}
spring.sql.init.mode=${TEST_SQL_INIT:never}
spring.sql.init.schema-locations=file:./database/schema.sql
app.bootstrap.enabled=false
app.jwt.secret-base64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.jwt.expiration-ms=3600000
app.jwt.issuer=salus-laboris-api
app.cors.allowed-origins=http://localhost:4200
