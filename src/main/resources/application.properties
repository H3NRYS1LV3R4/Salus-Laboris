spring.application.name=salusLaboris
server.port=8080

# ==========================================
# MYSQL
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/salus_laboris?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

# No crear ni modificar las tablas existentes
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=never

# ==========================================
# JWT
# ==========================================

app.jwt.secret-base64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.jwt.expiration-ms=3600000
app.jwt.issuer=salus-laboris-api