spring.application.name=salusLaboris
server.port=8080

# MySQL: define credenciales en las variables de entorno de STS.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/salus_laboris}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Validar los mapeos sin crear ni modificar las tablas existentes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

# JWT HS256: secreto externo de 32 bytes o más codificado en Base64.
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.expiration-ms=3600000
app.jwt.issuer=salus-laboris-api

# Angular en desarrollo; varios orígenes separados por comas.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Solo habilitar para crear el primer administrador en una base sin usuarios.
app.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}
app.bootstrap.username=${ADMIN_USERNAME:}
app.bootstrap.password=${ADMIN_PASSWORD:}
app.bootstrap.tipo-documento=${ADMIN_TIPO_DOCUMENTO:}
app.bootstrap.nro-documento=${ADMIN_DOCUMENTO:}
app.bootstrap.nombres=${ADMIN_NOMBRES:}
app.bootstrap.apellido-paterno=${ADMIN_APELLIDO:}
app.bootstrap.fecha-nacimiento=${ADMIN_FECHA_NACIMIENTO:}

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
