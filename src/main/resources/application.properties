spring.application.name=salusLaboris
server.port=8080

# Cambia DB_URL si tu base ya creada tiene otro nombre, host o puerto.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/salus_laboris}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Validar las entidades cuando existan, sin modificar las tablas de MySQL.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Estas propiedades se utilizarán al implementar JwtService.
# Por sí solas no habilitan autenticación JWT.
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.expiration-ms=3600000
app.jwt.issuer=salus-laboris-api
