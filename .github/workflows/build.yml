name: Java 17 - seguridad y MySQL 8

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar y probar con H2
        run: bash mvnw --batch-mode --no-transfer-progress clean verify

  verify-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: salus_test
          MYSQL_USER: salus_test
          MYSQL_PASSWORD: ci-only-test-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/salus_test?allowPublicKeyRetrieval=true&useSSL=false
      TEST_DB_USERNAME: salus_test
      TEST_DB_PASSWORD: ci-only-test-password
      TEST_DB_DRIVER: com.mysql.cj.jdbc.Driver
      TEST_DDL_AUTO: validate
      TEST_SQL_INIT: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validar esquema y probar con MySQL 8
        run: bash mvnw --batch-mode --no-transfer-progress clean verify
